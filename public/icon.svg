<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Beautiful modern crimson/red gradient matching the Singer brand palette -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3b40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b81419;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded squircle layout background for premium app icon look -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" />
  
  <!-- Subtle outer industrial alignment circle -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10" />
  
  <!-- Main centered stylized "S" brand logo -->
  <g filter="url(#shadow)">
    <!-- Elegant, bold custom-drawn geometric S curves -->
    <path d="M 345 160 C 345 115, 295 110, 256 110 C 190 110, 165 140, 165 185 C 165 260, 347 240, 347 325 C 347 375, 295 402, 256 402 C 185 402, 165 365, 165 325 L 225 325 C 225 348, 240 354, 256 354 C 285 354, 287 340, 287 325 C 287 250, 105 265, 105 185 C 105 130, 175 62, 256 62 C 325 62, 405 98, 405 160 Z" fill="#ffffff" fill-rule="nonzero"/>
  </g>

  <!-- Clean mini wrench graphic underneath to symbolize heavy maintenance, alignment, and reliability -->
  <g fill="#ffffff" opacity="0.95" transform="translate(196, 420)">
    <path d="m 20,4 c -4.4,0 -8,3.6 -8,8 0,3.1 1.8,5.7 4.4,7 L 0,35 c -0.6,0.6 -0.6,1.4 0,2 l 4,4 c 0.6,0.6 1.4,0.6 2,0 l 16,-16.4 c 1.3,2.6 3.9,4.4 7,4.4 4.4,0 8,-3.6 8,-8 c 0,-2.3 -1,-4.4 -2.6,-5.8 l -3.4,3.4 C 30,24.6 28.5,25 27,25 c -2.8,0 -5,-2.2 -5,-5 0,-1.5 0.4,-3 1.4,-4 l 3.4,-3.4 C 24.4,11 22.3,10 20,10" transform="scale(3) translate(-8, -4)" />
  </g>
</svg>
